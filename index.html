<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Group Member Evaluation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; max-width: 900px; }
    input, button { padding: 8px; margin: 5px 0; }
    table { border-collapse: collapse; margin-top: 20px; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
    .hidden { display: none; }
  </style>
</head>
<body>

<h2>Anonymous Group Member Evaluation</h2>
<p><b>Instructions:</b> Enter your NetID.</p>

<input type="text" id="netid" placeholder="Enter your NetID">
<button onclick="loadGroup()">Load My Group</button>

<div id="evaluation" class="hidden"></div>

<script>
// ======================================
// 🔴 PASTE YOUR ONE SCRIPT URL HERE
// ======================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzH9tYr_jg-KrjYf3myKTwDIHRmB0_JoJWDk7u0D8x8i-IrF0ebNaQFCwSAg2Yq35OsLQ/exec";

let currentUser = null;

// ======================================
// Load group from Google Sheets (doGet)
// ======================================
function loadGroup() {
  const netid = document.getElementById("netid").value.trim().toLowerCase();

  if (!netid) {
    alert("Please enter your NetID");
    return;
  }

  fetch(SCRIPT_URL + "?netid=" + netid)
    .then(res => res.json())
    .then(data => {
      if (data.error || data.length === 0) {
        alert("NetID not found.");
        return;
      }

      currentUser = netid;
      renderTable(data);
    })
    .catch(err => {
      console.error(err);
      alert("Failed to load group data.");
    });
}

// ======================================
// Render evaluation table
// ======================================
function renderTable(members) {
  let html = "<h3>Evaluate Your Group Members</h3>";
  html += "<table>";
  html += "<tr><th>Member</th><th>Proposal</th><th>Presentation</th><th>Final Project</th><th>Overall</th></tr>";

  members.forEach(member => {
    if ((member.user_id || "").toLowerCase() === currentUser) return;

    html += `<tr>
      <td>${member.name || member.user_id}</td>
      ${createSelect(member.user_id, 'proposal')}
      ${createSelect(member.user_id, 'presentation')}
      ${createSelect(member.user_id, 'final')}
      ${createSelect(member.user_id, 'overall')}
    </tr>`;
  });

  html += "</table>";
  html += '<button onclick="submitEvaluation()">Submit Evaluation</button>';

  const container = document.getElementById("evaluation");
  container.innerHTML = html;
  container.classList.remove("hidden");
}

// ======================================
// Create dropdown (0–5)
// ======================================
function createSelect(user, category) {
  let html = `<td><select id="${user}_${category}">`;
  for (let i = 0; i <= 5; i++) {
    html += `<option value="${i}">${i}</option>`;
  }
  html += "</select></td>";
  return html;
}

// ======================================
// Submit evaluation (doPost)
// ======================================
function submitEvaluation() {
  const rows = document.querySelectorAll("table tr");
  let data = [];

  rows.forEach((row, index) => {
    if (index === 0) return;

    const user = row.cells[0].innerText;
    const selects = row.querySelectorAll("select");

    data.push({
      evaluator: currentUser,
      evaluatee: user,
      proposal: selects[0].value,
      presentation: selects[1].value,
      final: selects[2].value,
      overall: selects[3].value
    });
  });

  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify(data),
    headers: { "Content-Type": "application/json" }
  })
  .then(res => res.json())
  .then(res => {
      if (res.status === "duplicate") {
        alert("You have already submitted.");
        return;
      }

      localStorage.setItem("submitted_" + currentUser, true);
      alert("Evaluation submitted successfully.");
      location.reload();
  })
  .catch(err => {
    console.error(err);
    alert("Submission failed. Please try again.");
  });
}
</script>

</body>
</html>
